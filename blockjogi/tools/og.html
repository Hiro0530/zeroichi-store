<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}#c{width:1200px;height:630px;background:#FAFBF7;position:relative;overflow:hidden;font-family:"BIZ UDPGothic";color:#1C2433}
#t{position:absolute;left:0;right:0;top:0;height:110px;background:#F2B705}
#t::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#2A2100 0 2px,transparent 2px 16px);opacity:.55}
h1{position:absolute;left:60px;top:150px;margin:0;font-size:92px}
p{position:absolute;left:64px;top:290px;margin:0;font-size:38px;line-height:1.6;font-weight:700}
small{position:absolute;left:64px;top:450px;font-size:28px;line-height:1.6;color:#5A6474}
#g{position:absolute;right:60px;top:150px}</style></head><body><div id="c"><div id="t"></div><h1>ブロック定規</h1><p>マイクラの円・球・ドームを<br>1段ずつ、数で作る</p><small>直径21なら 7→2→1→1→1→2→7<br>無料の非公式ツール</small><canvas id="g" width="440" height="440"></canvas></div>
<script type="module">
import * as S from "../shapes.js";
const g = S.ellipse(21,21,"line"), c = document.getElementById("g").getContext("2d"), cs = 20;
c.strokeStyle="#E1E7DF"; for(let i=0;i<=21;i++){c.beginPath();c.moveTo(i*cs+.5,0);c.lineTo(i*cs+.5,420);c.stroke();c.beginPath();c.moveTo(0,i*cs+.5);c.lineTo(420,i*cs+.5);c.stroke();}
c.fillStyle="#2F5D7C"; g.forEach((r,j)=>r.forEach((v,i)=>{if(v)c.fillRect(i*cs+1,j*cs+1,cs-1,cs-1)}));
c.fillStyle="#fff"; c.font="700 13px 'BIZ UDPGothic'"; c.textAlign="center"; c.textBaseline="middle"; c.fillText("7",10.5*cs,0.5*cs+1);
</script></body></html>
