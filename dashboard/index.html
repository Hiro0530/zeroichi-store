<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZEROICHI WORKS | Revenue Command</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e7eef7;background:#0c1220}*{box-sizing:border-box}body{margin:0;max-width:1500px;padding:24px;margin:auto}header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center}h1{font-size:25px;margin:4px 0}h2{font-size:17px}small,.muted{color:#9baec3}.tag{color:#8ce2d3}nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}button,select,input,textarea{background:#172338;color:#e7eef7;border:1px solid #35465e;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}button.active,button.primary{background:#1e847b;border-color:#1e847b;color:white}button:focus,input:focus,select:focus{outline:2px solid #78d4d0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:#131e30;border:1px solid #28384e;border-radius:12px;padding:17px}.card b{display:block;font-size:25px;margin:9px 0}.panel{margin:15px 0}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:950px}td,th{padding:11px;border-bottom:1px solid #2b3b50;text-align:left;font-size:13px;vertical-align:top}th{color:#91a9c5}.pill{display:inline-block;border:1px solid #445c74;border-radius:15px;padding:3px 8px}.warn{color:#ffcb81}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;font-size:13px;margin:10px 0}label input,label select,label textarea{display:block;width:100%;margin-top:4px}dialog{background:#101a2b;color:#eef;border:1px solid #53647c;border-radius:14px;max-width:720px;width:94%;max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 12px}.bar{height:10px;background:#26384d;border-radius:20px;overflow:hidden}.bar i{display:block;background:#39c2b2;height:100%}a{color:#8adbd1}@media(max-width:600px){body{padding:12px}h1{font-size:21px}}</style><header><div><small class="tag">ZEROICHI WORKS / REVENUE COMMAND</small><h1>受託案件・売上管理</h1><small>端末内保存｜非公開データはサーバーへ送信しません</small></div><div class="actions"><button id="add" class="primary">＋案件登録</button><button id="export">JSON保存</button><button id="import">JSON読込</button><input type="file" id="file" accept=".json,application/json" hidden></div></header><nav id="tabs"></nav><main id="view"></main><dialog id="dialog"><form id="form"><h2 id="formTitle">案件編集</h2><div id="fields" class="formgrid"></div><h2>応募前の確認</h2><div id="checks" class="formgrid"></div><p class="warn">確認欄は記録用です。外部サイトへの自動応募・送信は行いません。</p><div class="actions"><button type="submit" class="primary">保存</button><button type="button" id="cancel">閉じる</button></div></form></dialog><script>
(()=>{'use strict';const KEY='zeroichi_dashboard_v2';const STAGES=['営業','応募','受注','制作','納品','請求','入金','改善'];const TABS=['概要','案件一覧','戦略比較','工程管理','AI・運用状況','設定'];const F=[['name','案件名','text'],['platform','募集サイト','select','クラウドワークス|ココナラ|ランサーズ|その他'],['category','分類','text'],['fee','提示単価・円','number'],['requirements','応募条件','textarea'],['deadline','締切','date'],['competitors','競合応募数','number'],['stage','工程','select',STAGES.join('|')],['applied','応募済み','select','未確認|いいえ|はい'],['contracted','成約','select','未確認|いいえ|はい'],['invoiced','請求','select','未確認|いいえ|はい'],['paid','入金確認','select','未確認|いいえ|はい'],['expectedRevenue','期待売上・円','number'],['actualRevenue','確認済み入金・円','number'],['cost','実績原価・円','number'],['hours','作業時間・時間','number'],['probability','見込成約率・％','number'],['owner','担当','text'],['priority','優先順位','select','高|中|低'],['next','次の行動','textarea'],['evidence','証拠・参照URL','text'],['checkedAt','最終確認日','date'],['strategy','戦略','select','低単価・多件数|高単価・高確度'],['notes','停止要因・注意事項','textarea']];const CHECKS=[['terms','規約を確認'],['ai','AI利用可否を確認'],['secrets','秘密・個人情報保護を確認'],['budget','無断支出なし'],['approval','応募の個別承認を確認'],['offsite','サイト外誘導なし'],['scope','作業範囲・納期を確認']];const empty={jobs:[],goalMonth:300000,goalWeek:75000,ops:[{name:'Windows→GitHub Codex往復',state:'過去の成功確認・現在稼働未確認',owner:'Codex',next:'新しい実行証拠を確認'},{name:'GitHub売上台帳',state:'コード統合済・最新実行未確認',owner:'ChatGPT',next:'Actionsの最新実行を検証'},{name:'Muse応募・出品',state:'最新状態未確認',owner:'Muse',next:'応募履歴と成約・入金証拠を確認'},{name:'Claude Code',state:'利用制限中・復帰未確認',owner:'Claude本部',next:'復帰後に引継ぎ文書を確認'},{name:'納品前QA',state:'実装済・実案件未検証',owner:'Codex',next:'許諾済み案件で検証'}],handoff:'Claude Codeが使えない期間はChatGPT/Codexが内部実装と品質検査を担当。Claude再開後はGitHubのdocs/handoff.mdと変更履歴を確認。契約・送信・支出は承認制。'};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(empty)}catch{state=structuredClone(empty)}if(!Array.isArray(state.jobs))state=structuredClone(empty);let tab='概要',editing=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]));const money=x=>x===null||x===undefined||x===''?'未確認':'¥'+Number(x).toLocaleString('ja-JP');const n=x=>Number(x)||0;const paid=j=>j.paid==='はい'&&j.actualRevenue!==''&&j.actualRevenue!=null;const revenue=arr=>arr.filter(paid).reduce((a,j)=>a+n(j.actualRevenue),0);const kpi=(label,value,detail='')=>'<div class="card"><small>'+esc(label)+'</small><b>'+esc(value)+'</b><small>'+esc(detail)+'</small></div>';const sum=(arr,k)=>arr.reduce((a,j)=>a+n(j[k]),0);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存できません。JSONをダウンロードしてバックアップしてください。')}render()};const valid=(j)=>CHECKS.every(([k])=>j[k]===true);const stats=()=>{let j=state.jobs,app=j.filter(x=>x.applied==='はい').length,won=j.filter(x=>x.contracted==='はい').length;return{app,won,rate:app?Math.round(won/app*1000)/10:null}};function rows(a){return '<div class="scroll"><table><thead><tr><th>案件</th><th>サイト</th><th>戦略</th><th>単価</th><th>工程</th><th>期待売上</th><th>入金実績</th><th>利益率</th><th>担当</th><th>期限</th><th>優先</th><th>次の行動</th><th>操作</th></tr></thead><tbody>'+a.map(j=>{let profit=paid(j)&&j.cost!==''&&j.cost!=null&&n(j.actualRevenue)>0?((n(j.actualRevenue)-n(j.cost))/n(j.actualRevenue)*100).toFixed(1)+'%':'未確認';return '<tr><td>'+esc(j.name)+'</td><td>'+esc(j.platform)+'</td><td>'+esc(j.strategy)+'</td><td>'+money(j.fee)+'</td><td><span class="pill">'+esc(j.stage)+'</span></td><td>'+money(j.expectedRevenue)+'</td><td>'+ (paid(j)?money(j.actualRevenue):'未確認')+'</td><td>'+profit+'</td><td>'+esc(j.owner||'未確認')+'</td><td>'+esc(j.deadline||'未確認')+'</td><td>'+esc(j.priority||'未確認')+'</td><td>'+esc(j.next||'未確認')+'</td><td><button data-edit="'+esc(j.id)+'">編集</button></td></tr>'}).join('')+'</tbody></table></div>'}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let a=state.jobs,actual=revenue(a),s=stats(),goal=n(state.goalMonth),gap=Math.max(0,goal-actual),v=$('view');if(tab==='概要'){v.innerHTML='<div class="grid">'+kpi('確認済み入金',money(actual),'未確認の入金は含めません')+kpi('月間目標との差額',money(gap),'目標 '+money(goal))+kpi('応募済み',s.app+'件','成約 '+s.won+'件')+kpi('成約率',s.rate==null?'未確認':s.rate+'%','応募→成約の実測')+'</div><section class="panel"><h2>月間達成度</h2><div class="bar"><i style="width:'+Math.min(100,goal?actual/goal*100:0)+'%"></i></div><p>今週必要案件数：'+required(state.goalWeek,a)+'　今月必要案件数：'+required(goal,a)+'</p><small>必要案件数は確認済み契約単価・成約率の実測がない場合「未確認」です。</small></section><section class="panel"><h2>優先対応</h2>'+bottlenecks(a,s)+'</section><section class="panel"><h2>案件一覧</h2>'+rows(a.slice(0,10))+'</section>'}else if(tab==='案件一覧'){v.innerHTML='<section class="panel"><h2>案件一覧（'+a.length+'件）</h2><input id="search" placeholder="案件名・担当・分類で検索"><select id="stageFilter"><option value="">全工程</option>'+STAGES.map(x=>'<option>'+x+'</option>').join('')+'</select><div id="filtered">'+rows(a)+'</div></section>';$('search').oninput=$('stageFilter').onchange=()=>{let q=$('search').value.toLowerCase(),stage=$('stageFilter').value;$('filtered').innerHTML=rows(a.filter(j=>(!stage||j.stage===stage)&&[j.name,j.owner,j.category].join(' ').toLowerCase().includes(q)))}}else if(tab==='戦略比較'){v.innerHTML='<div class="grid">'+['低単価・多件数','高単価・高確度'].map(t=>{let g=a.filter(j=>j.strategy===t),apps=g.filter(j=>j.applied==='はい').length,wins=g.filter(j=>j.contracted==='はい').length;return '<section class="panel"><h2>'+t+'</h2><p>案件数：'+g.length+'件</p><p>平均単価：'+(g.some(j=>j.fee!=null&&j.fee!=='')?money(Math.round(sum(g,'fee')/g.filter(j=>j.fee!=null&&j.fee!=='').length)):'未確認')+'</p><p>期待売上：'+(g.some(j=>j.expectedRevenue!=null&&j.expectedRevenue!=='')?money(sum(g,'expectedRevenue')):'未確認')+'</p><p>入金実績：'+money(revenue(g))+'</p><p>成約率：'+(apps?(wins/apps*100).toFixed(1)+'%':'未確認')+'</p><p>作業時間：'+(g.some(j=>j.hours!=null&&j.hours!=='')?sum(g,'hours')+'時間':'未確認')+'</p></section>'}).join('')+'</div><section class="panel"><p class="warn">実測値が不足している間、戦略の優劣は未確認です。</p></section>'}else if(tab==='工程管理'){v.innerHTML='<div class="grid">'+STAGES.map(x=>kpi(x,a.filter(j=>j.stage===x).length+'件')).join('')+'</div><section class="panel"><h2>停止要因と改善提案</h2>'+bottlenecks(a,s)+'</section>'}else if(tab==='AI・運用状況'){v.innerHTML='<section class="panel"><h2>稼働状況（最終確認がないものは未確認）</h2><div class="scroll"><table><tr><th>処理</th><th>状態</th><th>担当</th><th>次の行動</th></tr>'+state.ops.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+esc(o.state)+'</td><td>'+esc(o.owner)+'</td><td>'+esc(o.next)+'</td></tr>').join('')+'</table></div></section><section class="panel"><h2>Claude Code停止中・復帰時の引き継ぎ</h2><textarea id="handoff" rows="7" style="width:100%">'+esc(state.handoff)+'</textarea><button id="saveHandoff">引き継ぎ保存</button></section>';$('saveHandoff').onclick=()=>{state.handoff=$('handoff').value;save()}}else{v.innerHTML='<section class="panel"><h2>目標と保存</h2><label>月間売上目標（円）<input id="month" type="number" min="0" value="'+n(state.goalMonth)+'"></label><label>週間売上目標（円）<input id="week" type="number" min="0" value="'+n(state.goalWeek)+'"></label><button id="saveGoal">目標を保存</button><p class="warn">この公開ページにはログイン認証がありません。情報は端末内のみ保存され、端末間で自動同期しません。共有PCで顧客情報を入力しないでください。</p></section>';$('saveGoal').onclick=()=>{state.goalMonth=Math.max(0,n($('month').value));state.goalWeek=Math.max(0,n($('week').value));save()}}}function required(target,a){let s=stats(),won=a.filter(j=>j.contracted==='はい'&&j.fee!=null&&j.fee!=='');if(!s.app||!s.won||!won.length)return'未確認';let avg=sum(won,'fee')/won.length;return avg>0?Math.ceil(Math.max(0,n(target)-revenue(a))/(avg*s.won/s.app))+'件':'未確認'}function bottlenecks(a,s){let x=[];if(!a.length)x.push('案件データがありません。公開募集を確認し、証拠付きで登録してください。');if(!s.app)x.push('応募実績が未確認です。応募済みの証拠を確認してください。');if(!s.won)x.push('成約実績が未確認です。応募済み案件の返信・契約状況を確認してください。');if(a.some(j=>!valid(j)))x.push('応募前チェックが未完了の案件があります。規約・秘密保護・承認を確認してください。');if(a.some(j=>j.deadline&&j.deadline<new Date().toISOString().slice(0,10)&&j.stage!=='入金'))x.push('期限超過の案件があります。');if(!revenue(a))x.push('入金証拠が未確認です。請求・検収・入金の順に追跡してください。');return x.map(y=>'<p>• '+esc(y)+'</p>').join('')}function edit(id){editing=id;let j=id?state.jobs.find(x=>x.id===id):null;$('formTitle').textContent=j?'案件編集':'案件登録';$('fields').innerHTML=F.map(([k,label,type,options])=>'<label>'+esc(label)+(type==='select'?'<select name="'+k+'"><option value="">未確認</option>'+options.split('|').map(o=>'<option value="'+esc(o)+'" '+(j&&j[k]===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+k+'" rows="2">'+esc(j?.[k]??'')+'</textarea>':'<input name="'+k+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(j?.[k]??'')+'">')+'</label>').join('');$('checks').innerHTML=CHECKS.map(([k,label])=>'<label><input type="checkbox" name="'+k+'" '+(j?.[k]?'checked':'')+'> '+esc(label)+'</label>').join('');$('dialog').showModal()}$('tabs').innerHTML=TABS.map(t=>'<button data-tab="'+t+'">'+t+'</button>').join('');$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('view').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)edit(b.dataset.edit)};$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();let f=e.target,j=editing?state.jobs.find(x=>x.id===editing):{id:'job-'+Date.now()};for(let [k,,type]of F){let v=f.elements[k].value;j[k]=type==='number'?(v===''?null:Number(v)):v}for(let[k]of CHECKS)j[k]=f.elements[k].checked;if(!editing)state.jobs.push(j);save();$('dialog').close()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='zeroichi-private-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.ops))throw Error();if(confirm('現在のデータを置き換えますか？')){state=x;save()}}catch{alert('読み込めません。JSONの形式を確認してください。')}e.target.value=''};render()})();
</script></html>
