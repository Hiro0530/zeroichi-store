name: kyotei-odds

# オッズを使った「紙の上だけ」の検証(ペーパートレード)。結果は非公開(キャッシュだけ)。
# 2026-10-26 サイトポリシー確認(Gemini調査+オーナー判断)で稼働。403/429/5xxで当日停止、1日200リクエスト上限。kyotei/odds_enabled.txt が無ければ何も取得しない。
# GitHub の定時実行は1.5〜3時間遅れることがあるので、4つの時間帯ごとに約2.5時間前に起動して時間帯の始まりまで待つ。遅れて起動しても残りの時間を受け持つ。
# 時間帯: 1=09:50〜12:48 / 2=12:51〜15:48 / 3=15:51〜18:48 / 4=18:51〜22:00(JST)。各時間帯に予備の起動(1時間後)。同じ時間帯は1つずつ(予備は本番が終わってから動き、時間帯が終わっていれば何もしない)。
# 各回: 60秒ごとに、締切の3〜9分前の自信度Sのレースだけ4ページ(単勝・複勝/2連単・2連複/3連複/3連単)を1回ずつ、3秒以上あけて読む。
on:
  schedule:
    - cron: "20 22 * * *"   # 07:20 JST → 時間帯1
    - cron: "20 23 * * *"   # 08:20 JST 予備 → 時間帯1
    - cron: "21 1 * * *"    # 10:21 JST → 時間帯2
    - cron: "21 2 * * *"    # 11:21 JST 予備 → 時間帯2
    - cron: "21 4 * * *"    # 13:21 JST → 時間帯3
    - cron: "21 5 * * *"    # 14:21 JST 予備 → 時間帯3
    - cron: "21 7 * * *"    # 16:21 JST → 時間帯4
    - cron: "21 8 * * *"    # 17:21 JST 予備 → 時間帯4
  workflow_dispatch:
    inputs:
      window: {description: "時間帯 1〜4", required: true, default: "1"}
      nowait: {description: "true なら時間帯の始まりまで待たない(試験用)", required: false, default: "false"}

permissions:
  contents: read

concurrency:
  group: kyotei-odds-${{ ((github.event.schedule == '20 22 * * *' || github.event.schedule == '20 23 * * *') && '1') || ((github.event.schedule == '21 1 * * *' || github.event.schedule == '21 2 * * *') && '2') || ((github.event.schedule == '21 4 * * *' || github.event.schedule == '21 5 * * *') && '3') || ((github.event.schedule == '21 7 * * *' || github.event.schedule == '21 8 * * *') && '4') || inputs.window }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Which window
        id: w
        run: |
          case "${{ github.event.schedule }}" in
            "20 22 * * *"|"20 23 * * *") W=1;; "21 1 * * *"|"21 2 * * *") W=2;;
            "21 4 * * *"|"21 5 * * *") W=3;; "21 7 * * *"|"21 8 * * *") W=4;; *) W="${{ inputs.window }}";;
          esac
          echo "w=$W" >> "$GITHUB_OUTPUT"
          echo "window $W"
      - name: Stop here unless enabled
        id: gate
        run: if [ -f kyotei/odds_enabled.txt ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "disabled"; fi
      - name: Wait until the window starts
        if: steps.gate.outputs.on == '1'
        run: |
          set -- $(python3 kyotei/odds_paper.py window ${{ steps.w.outputs.w }} 2>/dev/null || echo "00:00 00:00")
          START=$1
          if [ "${{ inputs.nowait }}" = "true" ]; then START=00:00; fi
          S=$(echo "${{ github.event.schedule }}" | awk '{if (NF==5) printf "%02d:%02d", $2, $1}')
          python3 kyotei/waituntil.py "$START" /tmp/health_wait.json "odds-w${{ steps.w.outputs.w }}" "$S"
          git pull -q --rebase origin main || true
      - if: steps.gate.outputs.on == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.on == '1'
        run: pip install -q numpy scipy
      - if: steps.gate.outputs.on == '1'
        uses: actions/cache/restore@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
          restore-keys: kyotei-paper-
      - if: steps.gate.outputs.on == '1'
        run: |
          mkdir -p kyotei/hist/paper
          python3 -c "import json,pathlib as P;a=P.Path('kyotei/hist/paper/health_odds.json');n=json.loads(P.Path('/tmp/health_wait.json').read_text()) if P.Path('/tmp/health_wait.json').exists() else [];o=json.loads(a.read_text()) if a.exists() else [];a.write_text(json.dumps((o+n)[-60:],ensure_ascii=False))" || true
          python kyotei/odds_paper.py loop ${{ steps.w.outputs.w }}
      - if: always() && steps.gate.outputs.on == '1'
        uses: actions/cache/save@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
