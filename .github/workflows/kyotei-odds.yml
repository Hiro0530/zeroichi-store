name: kyotei-odds

# オッズを使った「紙の上だけ」の検証(ペーパートレード)。1日3回の実行(各回の中で60秒ごとに確認)+予備。
# 2026-10-26 サイトポリシー確認(Gemini調査+オーナー判断)で稼働。403/429/5xxで当日停止、1日200リクエスト上限。動かすときは kyotei/odds_enabled.txt も必要(無ければ何も取得しない)。
# 各回: 60秒ごとに、締切の3〜9分前の自信度Sのレースだけ4ページ(単勝・複勝/2連単・2連複/3連複/3連単)を1回ずつ、3秒以上あけて読む。1日200回まで。結果は非公開。
on:
  schedule:
    - cron: "53 0 * * *"    # 09:53 JST 〜13:50
    - cron: "53 4 * * *"    # 13:53 JST 〜17:50
    - cron: "53 8 * * *"    # 17:53 JST 〜22:00
    - cron: "23 1 * * *"    # 予備 10:23(同じ時間帯の実行が動いていれば何もしない)
    - cron: "23 5 * * *"    # 予備 14:23
    - cron: "23 9 * * *"    # 予備 18:23
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Stop here unless enabled (and unless another odds run is already going)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f kyotei/odds_enabled.txt ]; then echo "disabled"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/kyotei-odds.yml/runs?status=in_progress" --jq "[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length" || echo 0)
          if [ "$n" != "0" ]; then echo "another odds run is in progress; exit"; exit 0; fi
          echo "on=1" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.on == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.on == '1'
        run: pip install -q numpy scipy
      - if: steps.gate.outputs.on == '1'
        uses: actions/cache/restore@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
          restore-keys: kyotei-paper-
      - if: steps.gate.outputs.on == '1'
        run: python kyotei/odds_paper.py loop
      - if: always() && steps.gate.outputs.on == '1'
        uses: actions/cache/save@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
