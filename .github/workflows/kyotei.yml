name: kyotei

# AI舟券 答え合わせ帳: 公式の番組表・競走成績 → 予想と答え合わせ → gh-pages の /kyotei/ だけ更新
on:
  schedule:
    - cron: "45 21 * * *"   # 06:45 JST
  push:
    branches: [main]
    paths: ["kyotei/trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyotei
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # 非公開リポジトリ(arbitrage-scout)へ履歴の控えを置くためのトークン(未設定なら控えは作らず、キャッシュだけで動く)
      HAS_DATA_TOKEN: ${{ secrets.KYOTEI_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q lhasa >/dev/null && pip install -q numpy scipy
      - name: Restore training history (not published)
        uses: actions/cache/restore@v4
        with:
          path: kyotei/hist
          key: kyotei-hist-${{ github.run_id }}
          restore-keys: kyotei-hist-
      - name: Restore durable copy from the private repo (only days missing in the cache)
        if: env.HAS_DATA_TOKEN == 'true'
        env:
          DATA_TOKEN: ${{ secrets.KYOTEI_DATA_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${DATA_TOKEN}@github.com/Hiro0530/arbitrage-scout.git" /tmp/kdata
          git -C /tmp/kdata sparse-checkout set kyotei_data
          mkdir -p /tmp/kdata/kyotei_data
          python kyotei/durable.py pull /tmp/kdata/kyotei_data
      - name: Run
        run: |
          MODE=$(head -1 kyotei/trigger.txt 2>/dev/null || echo daily)
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE=daily; fi
          echo "mode=$MODE"
          python kyotei/run.py $MODE 2>&1 | tee kyotei/last_run.log
          exit ${PIPESTATUS[0]}
      - name: Save training history (even if a later step fails, so files are not fetched twice)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kyotei/hist
          key: kyotei-hist-${{ github.run_id }}
      - name: Push durable copy to the private repo (derived numbers only, no raw files)
        if: always() && env.HAS_DATA_TOKEN == 'true'
        run: |
          python kyotei/durable.py push /tmp/kdata/kyotei_data
          cd /tmp/kdata
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git add kyotei_data
          if git commit -qm "kyotei_data: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull -q --rebase origin HEAD && git push -q origin HEAD && break; sleep 5; done
          fi
      - name: Commit record to main
        if: always()
        run: |
          mkdir -p kyotei/experiments && tail -n 80 kyotei/last_run.log > kyotei/experiments/last_run_tail.txt 2>/dev/null || true   # 実行の要約(数字の集計と進み具合だけ)
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git add -A kyotei   # hist/ などは kyotei/.gitignore で除外
          if git commit -m "kyotei: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Update gh-pages /kyotei/ only
        run: |
          cp kyotei/site/index.html /tmp/kyotei_index.html
          mkdir -p /tmp/kyotei_img && cp kyotei/site/*.jpg /tmp/kyotei_img/ 2>/dev/null || true   # 見出し写真
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cd /tmp/pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p kyotei
          cp /tmp/kyotei_index.html kyotei/index.html
          cp /tmp/kyotei_img/*.jpg kyotei/ 2>/dev/null || true
          git add kyotei/index.html kyotei/*.jpg 2>/dev/null || git add kyotei/index.html
          if git commit -m "kyotei page: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull --rebase -X theirs origin gh-pages && git push origin HEAD:gh-pages && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
