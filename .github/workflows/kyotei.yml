name: kyotei

# AI舟券 答え合わせ帳: 公式の番組表・競走成績 → 予想と答え合わせ → gh-pages の /kyotei/ だけ更新
on:
  schedule:
    - cron: "23 18 * * *"   # 03:23 JST に早めに起動して 06:45 JST まで待つ(定時実行が1.5〜3時間遅れることがあるため)
    - cron: "53 19 * * *"   # 04:53 JST 2本目の早め起動(1本目が終わるまで順番待ち。済んでいれば何もしない)
    - cron: "45 21 * * *"   # 06:45 JST 遅めの予備
    - cron: "17 22 * * *"   # 07:17 JST 遅めの予備
  push:
    branches: [main]
    paths: ["kyotei/trigger.txt"]
  workflow_dispatch:
    inputs:
      wait_until: {description: "この時刻(JST HH:MM)まで待ってから実行(空なら待たない)", required: false, default: ""}

permissions:
  contents: write

concurrency:
  group: kyotei
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      # 非公開リポジトリ(arbitrage-scout)へ履歴の控えを置くためのトークン(未設定なら控えは作らず、キャッシュだけで動く)
      HAS_DATA_TOKEN: ${{ secrets.KYOTEI_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait until 06:45 JST (early starts only)
        run: |
          T=""
          case "${{ github.event.schedule }}" in "23 18 * * *"|"53 19 * * *") T="06:45";; esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then T="${{ inputs.wait_until }}"; fi
          S=$(echo "${{ github.event.schedule }}" | awk '{if (NF==5) printf "%02d:%02d", $2, $1}')
          if [ -n "$T" ]; then python3 kyotei/waituntil.py "$T" /tmp/health_wait.json "daily" "$S"; else python3 kyotei/waituntil.py 00:00 /tmp/health_wait.json "daily" "$S"; fi
          git pull -q --rebase origin main || true   # 待っているあいだの更新を取り込む
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q lhasa >/dev/null && pip install -q numpy scipy
      - name: Restore training history (not published)
        uses: actions/cache/restore@v4
        with:
          path: kyotei/hist
          key: kyotei-hist-${{ github.run_id }}
          restore-keys: kyotei-hist-
      - name: Restore paper-trading records (not published; empty while odds are disabled)
        uses: actions/cache/restore@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
          restore-keys: kyotei-paper-
      - name: Restore durable copy from the private repo (only days missing in the cache)
        if: env.HAS_DATA_TOKEN == 'true'
        env:
          DATA_TOKEN: ${{ secrets.KYOTEI_DATA_TOKEN }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${DATA_TOKEN}@github.com/Hiro0530/arbitrage-scout.git" /tmp/kdata
          git -C /tmp/kdata sparse-checkout set kyotei_data
          mkdir -p /tmp/kdata/kyotei_data
          python kyotei/durable.py pull /tmp/kdata/kyotei_data
      - name: Run
        run: |
          mkdir -p kyotei/hist/paper
          MODE=$(head -1 kyotei/trigger.txt 2>/dev/null || echo daily)
          if [ "${{ github.event_name }}" != "push" ]; then MODE=daily; fi   # 定時・手動実行は毎朝の処理。trigger.txt は push のときだけ
          echo "mode=$MODE"
          python3 -c "import json,pathlib as P;a=P.Path('kyotei/hist/paper/health_daily.json');n=json.loads(P.Path('/tmp/health_wait.json').read_text()) if P.Path('/tmp/health_wait.json').exists() else [];o=json.loads(a.read_text()) if a.exists() else [];a.write_text(json.dumps((o+n)[-60:],ensure_ascii=False))" || true
          python kyotei/run.py $MODE 2>&1 | tee kyotei/last_run.log
          exit ${PIPESTATUS[0]}
      - name: Save training history (even if a later step fails, so files are not fetched twice)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kyotei/hist
          key: kyotei-hist-${{ github.run_id }}
      - name: Save paper-trading records
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kyotei/hist/paper
          key: kyotei-paper-${{ github.run_id }}
      - name: Push durable copy to the private repo (derived numbers only, no raw files)
        if: always() && env.HAS_DATA_TOKEN == 'true'
        run: |
          python kyotei/durable.py push /tmp/kdata/kyotei_data
          cd /tmp/kdata
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git add kyotei_data
          if git commit -qm "kyotei_data: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull -q --rebase origin HEAD && git push -q origin HEAD && break; sleep 5; done
          fi
      - name: Commit record to main
        if: always()
        run: |
          mkdir -p kyotei/experiments && tail -n 80 kyotei/last_run.log > kyotei/experiments/last_run_tail.txt 2>/dev/null || true   # 実行の要約(数字の集計と進み具合だけ)
          git config user.name "kyotei-bot"
          git config user.email "kyotei-bot@users.noreply.github.com"
          git add -A kyotei   # hist/ などは kyotei/.gitignore で除外
          if git commit -m "kyotei: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Update gh-pages /kyotei/ only
        run: |
          cp kyotei/site/index.html /tmp/kyotei_index.html
          mkdir -p /tmp/kyotei_html && cp kyotei/site/terms.html kyotei/site/join.html /tmp/kyotei_html/ 2>/dev/null || true   # 有料版の利用規約・会員のメール登録
          mkdir -p /tmp/kyotei_img && cp kyotei/site/*.jpg /tmp/kyotei_img/ 2>/dev/null || true   # 見出し写真
          # 検索の入口のページ(場ごと・日付ごと・レースごと)と sitemap。予想と答え合わせのファイルから毎回作り直す。失敗しても本体のページは出す
          rm -rf /tmp/kyotei_pages && (python3 kyotei/seo_pages.py && cp -r kyotei/site_pages /tmp/kyotei_pages) || echo "seo_pages skipped"
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cd /tmp/pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p kyotei
          cp /tmp/kyotei_index.html kyotei/index.html
          cp /tmp/kyotei_img/*.jpg kyotei/ 2>/dev/null || true
          cp /tmp/kyotei_html/*.html kyotei/ 2>/dev/null || true
          if [ -d /tmp/kyotei_pages ]; then rm -f kyotei/sitemap-20??-??.xml; cp -r /tmp/kyotei_pages/. kyotei/; fi   # 上書きだけ(ページは消さない)。古い月ごとのサイトマップ(レースごとのURL入り)だけ消す
          grep -q "kyotei/sitemap.xml" robots.txt 2>/dev/null || printf "\nSitemap: https://zeroichiworks.net/kyotei/sitemap.xml\n" >> robots.txt
          git add -A kyotei robots.txt 2>/dev/null || git add kyotei/index.html
          if git commit -m "kyotei page: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"; then
            for i in 1 2 3; do git pull --rebase -X theirs origin gh-pages && git push origin HEAD:gh-pages && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
